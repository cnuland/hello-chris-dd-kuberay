---
# MinIO. The upstream quay.io/minio and docker.io/minio images went private in 2025, so this uses the
# Bitnami build (non-root, arbitrary-UID friendly). MINIO_DEFAULT_BUCKETS creates the buckets on boot,
# which replaces the old mc job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: docker.io/bitnamilegacy/minio:latest
        envFrom:
        - secretRef:
            name: minio-root-user
        env:
        - name: MINIO_DEFAULT_BUCKETS
          value: "sessions,decision-traces"
        - name: MINIO_DATA_DIR
          value: /bitnami/minio/data
        ports:
        - containerPort: 9000
          protocol: TCP
          name: api
        - containerPort: 9001
          protocol: TCP
          name: console
        readinessProbe:
          httpGet: { path: /minio/health/ready, port: 9000 }
          periodSeconds: 10
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 2Gi
        volumeMounts:
        - mountPath: /bitnami/minio/data
          name: minio
      volumes:
      - persistentVolumeClaim:
          claimName: minio
        name: minio
